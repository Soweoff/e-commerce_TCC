<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wience Store - Catálogo ativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <span>Wience Store</span>
        <button id="cart-btn" type="button">Carrinho <span id="cart-count" class="count">0</span></button>
    </nav>

    <header>
        <h1>Wience Store</h1>
        <p>Catálogo ativo: HTML + JavaScript no navegador (busca, ordenação e carrinho local).</p>
    </header>

    <main>
        <div class="toolbar">
            <input id="search" type="search" placeholder="Buscar produto..." aria-label="Buscar produto">
            <select id="sort" aria-label="Ordenar">
                <option value="recent">Mais recentes</option>
                <option value="price-asc">Menor preço</option>
                <option value="price-desc">Maior preço</option>
                <option value="name">Nome (A-Z)</option>
            </select>
            <label class="check"><input id="only-stock" type="checkbox"> Somente em estoque</label>
        </div>

        <p id="status" class="status" role="status">Carregando produtos...</p>
        <div id="grid" class="grid"></div>
    </main>

    <aside id="cart-panel" class="cart-panel" hidden>
        <h2>Carrinho</h2>
        <ul id="cart-list"></ul>
        <p>Total: <strong id="cart-total">R$ 0,00</strong></p>
        <button id="cart-clear" type="button">Esvaziar</button>
    </aside>

    <footer>Wience Store &copy; 2026 - Todos os direitos reservados</footer>

    <script src="app.js" defer></script>
</body>
</html>
